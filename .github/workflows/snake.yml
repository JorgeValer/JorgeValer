name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23f2760c&color_dots=%23fff3e0,%23ffcc80,%23ffa726,%23fb8c00,%23e65100
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23f2760c&color_dots=%23fff3e0,%23ffcc80,%23ffa726,%23fb8c00,%23e65100

      - name: Push snake svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
